services:
  - type: web
    runtime: node
    name: agenda-web-pacs
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_ORTHANC_URL
        sync: false
      - key: NEXT_PUBLIC_OHIF_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-nano
      - key: OPENAI_FALLBACK_MODEL
        value: gpt-5.4-mini
      - key: AI_EXTRACTION_ENABLED
        value: "false"
      - key: AI_MAX_INPUT_CHARS
        value: "12000"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "4000"
      - key: AI_TIMEOUT_MS
        value: "45000"
      - key: AI_MAX_REPORTS_PER_DAY
        value: "100"
      - key: AI_MONTHLY_BUDGET_USD
        value: "10"
      - key: AI_STORE_RAW_PROMPT
        value: "false"
      - key: AI_STORE_RAW_RESPONSE
        value: "false"
      - key: AI_LOG_USAGE
        value: "true"
      - key: AI_MIN_CONFIDENCE_TO_AUTO_SUGGEST
        value: "0.65"
      - key: AI_MIN_CONFIDENCE_TO_AUTO_CREATE_CANDIDATE
        value: "0.50"
      - key: AI_AUTO_CONFIRM_FINDINGS
        value: "false"

  - type: web
    runtime: image
    name: agenda-orthanc
    plan: free
    image:
      url: docker.io/orthancteam/orthanc:latest
    envVars:
      - key: DICOM_WEB_PLUGIN_ENABLED
        value: "true"
      - key: OHIF_PLUGIN_ENABLED
        value: "true"
      - key: ORTHANC__OHIF__DATA_SOURCE
        value: dicom-web
      - key: ORTHANC__HTTP_PORT
        value: "10000"
      - key: ORTHANC__NAME
        value: Agenda Imagenología - Demo
      - key: ORTHANC__REGISTERED_USERS
        sync: false
